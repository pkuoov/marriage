name: Behavior Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use project Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run source and narrative checks
        run: npm run check

      # Local work can use test:local's single-route smoke. CI intentionally
      # keeps the complete smoke:browser matrix for flow and rendering drift.
      # Hosted browser startup occasionally stalls despite the same commit
      # passing locally, so retry the complete deterministic matrix once.
      - name: Run browser behavior replay
        env:
          # Hosted runners can be slower than local machines. Keep every
          # assertion, but give each browser action and route enough headroom.
          SMOKE_ACTION_TIMEOUT_MS: 30000
          SMOKE_STEP_TIMEOUT_MS: 240000
        run: npm run smoke:browser || npm run smoke:browser
