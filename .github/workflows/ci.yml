name: Behavior Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use project Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run source and narrative checks
        run: npm run check

      # Local work can use test:local's single-route smoke. CI intentionally
      # keeps the complete smoke:browser matrix for flow and rendering drift.
      - name: Run browser behavior replay
        env:
          # Hosted runners can be slower than local machines. Keep every
          # assertion, but give each browser action and route enough headroom.
          SMOKE_ACTION_TIMEOUT_MS: 30000
          SMOKE_STEP_TIMEOUT_MS: 240000
        run: npm run smoke:browser 2>&1 | tee browser-replay.log

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-diagnostics
          path: |
            browser-replay.log
            output/playwright/
          if-no-files-found: ignore
          retention-days: 7
