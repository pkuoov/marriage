name: Windows Portable Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use packaging Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source and content
        run: npm run check

      - name: Build Windows portable executable
        run: npm run package:win

      - name: Verify PE artifact and checksum
        run: npm run verify:win-package

      - name: Upload verified package
        uses: actions/upload-artifact@v6
        with:
          name: LivestreamDetectiveDemo-windows-x64
          path: |
            dist/steam/*.exe
            dist/steam/*.sha256
            dist/steam/windows-package-report.json
          if-no-files-found: error
          retention-days: 14
