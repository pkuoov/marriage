name: Windows Portable Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use packaging Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source and content
        run: npm run check

      - name: Build Windows portable executable
        run: npm run package:win

      - name: Verify PE artifact and checksum
        run: npm run verify:win-package

      - name: Launch packaged app and verify offline save bridge
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/steam/*.exe | Select-Object -First 1
          $report = Join-Path (Resolve-Path dist/steam) "windows-runtime-smoke.json"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--release-smoke-report=$report" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged runtime smoke exited with code $($process.ExitCode)" }
          npm run verify:win-runtime-smoke

      - name: Upload verified package
        uses: actions/upload-artifact@v6
        with:
          name: LivestreamDetectiveDemo-windows-x64
          path: |
            dist/steam/*.exe
            dist/steam/*.sha256
            dist/steam/windows-package-report.json
            dist/steam/windows-runtime-smoke.json
          if-no-files-found: error
          retention-days: 14
